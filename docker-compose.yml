services:
  verivote-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
